; S1 build-only probe: compiles the same-sample calibrated ADC seam against the
; real ESP32-S3 Arduino / esp_adc_cal SDK. No upload, no serial, no hardware
; action is part of this slice. The MQ-135 pin is the unchanged board value.
[platformio]
default_envs = sigap_n16r8_sd

[env]
platform = espressif32@7.1.3
board = esp32-s3-devkitc-1
framework = arduino
build_unflags =
  -std=gnu++11
build_flags =
  -I../../../lib/config/src
  -I../../../lib/acquisition/src
  -I../../../lib/telemetry_contract/src
  -I../../../lib/models/src
  -std=gnu++17
  -DBOARD_HAS_PSRAM
  -DSIGAP_BOARD_N16R8
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
monitor_speed = 115200

[env:sigap_n16r8_sd]
board_upload.flash_size = 16MB
board_upload.flash_mode = qio
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_build.f_flash = 80000000L
board_build.f_cpu = 240000000L
board_build.partitions = ../../../partitions_n16r8.csv
