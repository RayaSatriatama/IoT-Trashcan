[platformio]
default_envs = sigap_n16r8

[env]
monitor_speed = 115200
test_framework = unity
build_flags =
  -Ilib/config/src
  -Ilib/acquisition/src
  -Ilib/calibration/src
  -Ilib/provisioning/src
  -Iinclude

[env:sigap_n16r8]
platform = espressif32@7.1.3
board = esp32-s3-devkitc-1
framework = arduino
board_upload.flash_size = 16MB
board_upload.flash_mode = qio
board_build.flash_mode = qio
; Keep manifest parity with N16R8 references. espressif32@7.1.3 uses
; upload.flash_size for the image header and upload tooling.
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_build.f_flash = 80000000L
board_build.f_cpu = 240000000L
board_build.partitions = partitions_n16r8.csv
board_build.filesystem = littlefs
build_unflags =
  -std=gnu++11
build_flags =
  -Ilib/config/src
  -Ilib/acquisition/src
  -Ilib/calibration/src
  -Ilib/provisioning/src
  -Iinclude
  -std=gnu++17
  -DBOARD_HAS_PSRAM
  -DSIGAP_BOARD_N16R8
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1

[env:sigap_n16r8_sd]
extends = env:sigap_n16r8
build_flags =
  -Ilib/config/src
  -Ilib/acquisition/src
  -Ilib/calibration/src
  -Ilib/provisioning/src
  -Iinclude
  ${env:sigap_n16r8.build_flags}
  -DSIGAP_USE_SD=1

[env:sigap_bench]
extends = env:sigap_n16r8
build_flags =
  -Ilib/config/src
  -Ilib/acquisition/src
  -Ilib/calibration/src
  -Ilib/provisioning/src
  -Iinclude
  ${env:sigap_n16r8.build_flags}
  -DSIGAP_BENCH=1

[env:native]
platform = native
test_framework = unity
test_build_src = no
build_flags =
  -Ilib/config/src
  -Ilib/acquisition/src
  -Ilib/calibration/src
  -Ilib/provisioning/src
  -Iinclude
  -std=c++17
