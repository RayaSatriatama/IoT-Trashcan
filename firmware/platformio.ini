[platformio]
default_envs = sigap_n16r8

[env]
monitor_speed = 115200
test_framework = unity
build_flags =
  -Ilib/config/src
  -Ilib/acquisition/src
  -Ilib/maintenance/src
  -Ilib/calibration/src
  -Ilib/provisioning/src
  -Ilib/processing/src
  -Ilib/models/src
  -Ilib/fuzzy/src
  -Ilib/safety/src
  -Ilib/storage/src
  -Ilib/telemetry_archive/src
  -Ilib/telemetry_contract/src
  -Ilib/network/src
  -Iinclude

[env:sigap_n16r8]
platform = espressif32@7.1.3
board = esp32-s3-devkitc-1
framework = arduino
build_src_filter =
  +<*>
  -<diagnostic_ble_main.cpp>
  -<diagnostic_nvs_guards.cpp>
  -<diagnostic_wifi_test_main.cpp>
  -<diagnostic_wifi_test_nvs_guards.cpp>
  -<diagnostic_wifi_test_dhcp_cache.cpp>
board_upload.flash_size = 16MB
board_upload.flash_mode = qio
board_build.flash_mode = qio
; Keep manifest parity with N16R8 references. espressif32@7.1.3 uses
; upload.flash_size for the image header and upload tooling.
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_build.f_flash = 80000000L
board_build.f_cpu = 240000000L
board_build.partitions = partitions_n16r8.csv
board_build.filesystem = littlefs
lib_deps =
  h2zero/NimBLE-Arduino@2.5.1
extra_scripts =
  pre:scripts/patch_nimble_restore.py
build_unflags =
  -std=gnu++11
build_flags =
  -Ilib/config/src
  -Ilib/acquisition/src
  -Ilib/calibration/src
  -Ilib/provisioning/src
  -Ilib/processing/src
  -Ilib/models/src
  -Ilib/fuzzy/src
  -Ilib/safety/src
  -Ilib/storage/src
  -Ilib/telemetry_archive/src
  -Ilib/telemetry_contract/src
  -Ilib/network/src
  -Ilib/debug/src
  -Iinclude
  -std=gnu++17
  -DBOARD_HAS_PSRAM
  -DSIGAP_BOARD_N16R8
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED=1
  -DCONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED=1
  -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
  -DCONFIG_BT_NIMBLE_MAX_BONDS=0
  -DCONFIG_BT_NIMBLE_MAX_CCCDS=2
  -DCONFIG_BT_NIMBLE_MEM_ALLOC_MODE_EXTERNAL=1
  -DMYNEWT_VAL_BLE_STORE_CONFIG_PERSIST=0

; Opt-in simulated sensor readers; the default target remains physical/OFF.
[env:sigap_n16r8_sensor_sim]
extends = env:sigap_n16r8
build_flags =
  ${env:sigap_n16r8.build_flags}
  -DSIGAP_SENSOR_SIMULATION=1
  -include include/network_config.h
lib_deps =
  h2zero/NimBLE-Arduino@2.5.1
  https://github.com/joltwallet/esp_littlefs.git#v1.14.4

; OTA partition layout (ota_0/ota_1 + 1.5MB spiffs + coredump)
[env:sigap_n16r8_ota]
extends = env:sigap_n16r8
board_build.partitions = partitions_ota.csv

; OTA partition layout with sensor simulation (proven to boot with OTA layout)
[env:sigap_n16r8_ota_sim]
extends = env:sigap_n16r8_sensor_sim
board_build.partitions = partitions_ota.csv

; Original OTA layout from working DNS boot (ota_0 6.6MB + 1.5MB spiffs + coredump)
[env:sigap_n16r8_ota_orig]
extends = env:sigap_n16r8_sensor_sim
board_build.partitions = partitions_ota_orig.csv

[env:sigap_n16r8_sd]
extends = env:sigap_n16r8
build_flags =
  -Ilib/config/src
  -Ilib/acquisition/src
  -Ilib/calibration/src
  -Ilib/provisioning/src
  -Ilib/processing/src
  -Ilib/models/src
  -Ilib/fuzzy/src
  -Ilib/safety/src
  -Ilib/storage/src
  -Ilib/telemetry_archive/src
  -Ilib/telemetry_contract/src
  -Ilib/network/src
  -Iinclude
  ${env:sigap_n16r8.build_flags}
  -DSIGAP_USE_SD=1
  -DSIGAP_SD_TRANSPORT_SDMMC_1BIT=1
lib_ignore = SD, SPI

; Compile-only HTTPS composition check.  The endpoint and empty CA are
; deliberate non-production placeholders.  Runtime startup remains fail-closed
; until a reviewed private endpoint and trusted CA are supplied out of tree.
[env:sigap_n16r8_https_compile]
extends = env:sigap_n16r8
build_flags =
  -Ilib/config/src
  -Ilib/acquisition/src
  -Ilib/calibration/src
  -Ilib/provisioning/src
  -Ilib/processing/src
  -Ilib/models/src
  -Ilib/fuzzy/src
  -Ilib/safety/src
  -Ilib/storage/src
  -Ilib/telemetry_archive/src
  -Ilib/telemetry_contract/src
  -Ilib/network/src
  -Iinclude
  ${env:sigap_n16r8.build_flags}
  -DSIGAP_NETWORK_ENDPOINT=\"https://task9.invalid\"
  -DSIGAP_NETWORK_CA_CERT=\"\"

; Combined SD_MMC and HTTPS composition check for the selected PKM KC board.
; This remains intentionally fail-closed at runtime: a reviewed private
; endpoint and non-empty trusted CA are supplied only outside source control.
[env:sigap_n16r8_sd_https_compile]
extends = env:sigap_n16r8_sd
build_flags =
  ${env:sigap_n16r8_sd.build_flags}
  -DSIGAP_NETWORK_ENDPOINT=\"https://task9.invalid\"
  -DSIGAP_NETWORK_CA_CERT=\"\"

[env:sigap_n16r8_debug]
extends = env:sigap_n16r8
build_flags =
  ${env:sigap_n16r8.build_flags}
  -DSIGAP_FULL_DEBUG_BUILD=1
  -Wl,-Map=.pio/build/sigap_n16r8_debug/firmware.map

; Explicit external-SPI variant for the alternate SIGAP hardware topology.
; The selected PKM KC board uses the SD_MMC 1-bit environment above.
[env:sigap_n16r8_sd_spi]
extends = env:sigap_n16r8
build_flags =
  -Ilib/config/src
  -Ilib/acquisition/src
  -Ilib/calibration/src
  -Ilib/provisioning/src
  -Ilib/processing/src
  -Ilib/models/src
  -Ilib/fuzzy/src
  -Ilib/safety/src
  -Ilib/storage/src
  -Ilib/telemetry_archive/src
  -Ilib/telemetry_contract/src
  -Ilib/network/src
  -Iinclude
  ${env:sigap_n16r8.build_flags}
  -DSIGAP_USE_SD=1

[env:sigap_bench]
extends = env:sigap_n16r8
build_flags =
  -Ilib/config/src
  -Ilib/acquisition/src
  -Ilib/calibration/src
  -Ilib/provisioning/src
  -Ilib/processing/src
  -Ilib/models/src
  -Ilib/fuzzy/src
  -Ilib/safety/src
  -Ilib/storage/src
  -Ilib/telemetry_archive/src
  -Ilib/telemetry_contract/src
  -Ilib/network/src
  -Iinclude
  ${env:sigap_n16r8.build_flags}
  -DSIGAP_BENCH=1

[env:sigap_ble_diag]
extends = env:sigap_n16r8
lib_ldf_mode = deep+
build_src_filter =
  -<*>
  +<diagnostic_ble_main.cpp>
  +<diagnostic_nvs_guards.cpp>
build_flags =
  ${env:sigap_n16r8.build_flags}
  -DSIGAP_BLE_DIAGNOSTIC=1
  -Wl,--wrap=nvs_flash_init
  -Wl,--wrap=nvs_flash_init_partition
  -Wl,--wrap=nvs_flash_init_partition_ptr
  -Wl,--wrap=nvs_flash_erase
  -Wl,--wrap=nvs_flash_erase_partition
  -Wl,--wrap=nvs_flash_erase_partition_ptr
  -Wl,--wrap=esp_partition_erase_range
  -Wl,--wrap=nvs_open
  -Wl,--wrap=nvs_get_blob
  -Wl,--wrap=nvs_set_blob
  -Wl,--wrap=nvs_commit
  -Wl,--wrap=nvs_erase_key
  -Wl,--wrap=nvs_erase_all

; Host-only candidate image for exercising production BLE provisioning and WiFi modules.
; Saved-network credentials and normal NVS writes remain a separate physical gate.
[env:sigap_ble_wifi_test]
extends = env:sigap_n16r8
lib_ldf_mode = deep+
build_src_filter =
  -<*>
  +<diagnostic_wifi_test_main.cpp>
  +<diagnostic_wifi_test_nvs_guards.cpp>
  +<diagnostic_wifi_test_dhcp_cache.cpp>
build_flags =
  ${env:sigap_n16r8.build_flags}
  -DSIGAP_BLE_WIFI_TEST=1
  -Wl,--wrap=dhcp_ip_addr_restore
  -Wl,--wrap=dhcp_ip_addr_store
  -Wl,--wrap=dhcp_ip_addr_erase
  -Wl,--wrap=nvs_flash_erase
  -Wl,--wrap=nvs_flash_erase_partition
  -Wl,--wrap=nvs_flash_erase_partition_ptr
  -Wl,--wrap=esp_partition_erase_range
  -Wl,--wrap=nvs_erase_key
  -Wl,--wrap=nvs_erase_all
  -Wl,-Map=.pio/build/sigap_ble_wifi_test/firmware.map

[env:native]
platform = native
test_framework = unity
test_build_src = no
build_flags =
  -Ilib/config/src
  -Ilib/acquisition/src
  -Ilib/maintenance/src
  -Ilib/calibration/src
  -Ilib/provisioning/src
  -Ilib/processing/src
  -Ilib/models/src
  -Ilib/fuzzy/src
  -Ilib/safety/src
  -Ilib/storage/src
  -Ilib/telemetry_archive/src
  -Ilib/telemetry_contract/src
  -Ilib/network/src
  -Iinclude
  -Isrc/app
  -Itest/native/test_arduino_storage
  -Ilib/debug/src
  -std=c++17
